name: Bug report
description: Report a reproducible problem in HookLab
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands, or a small repo/gist that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: HookLab version or commit, Node.js version, OS.
      placeholder: "hooklab 0.0.0, node v24.0.0, Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Paste only relevant excerpts. Redact secrets and endpoints.
      render: shell
